name: Essai sources de couvertures (temporaire)

on:
  workflow_dispatch:
    inputs:
      collection:
        type: choice
        options: [bd, romans]
        default: bd
      maxi:
        default: "400"

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python scripts/essai_couv.py ${{ inputs.collection }} ${{ inputs.maxi }}
      - name: Déposer les images sur une branche à part (pas sur le site)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "suivixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B=essai-couvertures-${{ inputs.collection }}
          git checkout -q --orphan "$B"
          git rm -rq --cached . >/dev/null
          git add essai
          git commit -q -m "Essai des sources de couvertures (${{ inputs.collection }})"
          git push -qf origin "$B"
