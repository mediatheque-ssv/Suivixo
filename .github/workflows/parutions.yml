name: Vérifier les parutions

on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch:
    inputs:
      collection:
        description: "Collection (toutes = mangas, puis BD jeunesse, puis romans jeunesse)"
        type: choice
        options: [toutes, mangas, bd, romans]
        default: toutes
      serie:
        description: "Tester une seule série (identifiant, ex. atelier-des-sorciers). Rien n'est enregistré."
        required: false
        default: ""
      limite:
        description: "Nombre maximum de séries à vérifier (vide = toutes)"
        required: false
        default: ""
      forcer:
        description: "Tout revérifier, même les séries vues récemment"
        type: boolean
        default: false
      bnf_seulement:
        description: "Refaire seulement la BnF (plus rapide, garde AniList)"
        type: boolean
        default: false
      verifier_auteurs:
        description: "Revérifier les liens AniList automatiques avec l'auteur d'Orphée"
        type: boolean
        default: false
      manga_news_seulement:
        description: "Mettre à jour seulement le nombre de tomes Manga-News (rapide)"
        type: boolean
        default: false
      couvertures:
        description: "Chercher seulement les couvertures qui manquent"
        type: boolean
        default: false
      series:
        description: "Revérifier et enregistrer ces séries (identifiants séparés par des virgules). Utilisé par le bouton « Revérifier » du site."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # les tests d'une seule série tournent à part, sans bloquer ni annuler les passages complets
  group: parutions-${{ inputs.serie && 'test' || 'complet' }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Pillow (vignettes des couvertures)
        run: pip install --quiet pillow

      - name: Interroger AniList, Manga-News et la BnF
        env:
          COLLECTION: ${{ inputs.collection }}
          SERIE: ${{ inputs.serie }}
          LIMITE: ${{ inputs.limite }}
          FORCER: ${{ inputs.forcer }}
          BNF: ${{ inputs.bnf_seulement }}
          AUTEURS: ${{ inputs.verifier_auteurs }}
          MN: ${{ inputs.manga_news_seulement }}
          COUV: ${{ inputs.couvertures }}
          SERIES: ${{ inputs.series }}
        run: |
          ARGS="--max-minutes 120"
          [ -n "$SERIE" ] && ARGS="$ARGS --serie $SERIE"
          [ -n "$LIMITE" ] && ARGS="$ARGS --limite $LIMITE"
          [ "$FORCER" = "true" ] && ARGS="$ARGS --forcer"
          [ "$BNF" = "true" ] && ARGS="$ARGS --bnf-seulement"
          [ "$AUTEURS" = "true" ] && ARGS="$ARGS --verifier-auteurs"
          [ "$MN" = "true" ] && ARGS="$ARGS --manga-news-seulement"
          [ "$COUV" = "true" ] && ARGS="$ARGS --couvertures"
          [ -n "$SERIES" ] && ARGS="$ARGS --series $SERIES"
          if [ -z "$COLLECTION" ] || [ "$COLLECTION" = "toutes" ]; then
            # passage du lundi : le temps est partagé entre les collections
            python scripts/enrich.py $ARGS --collection mangas --max-minutes 70 || true
            python scripts/enrich.py $ARGS --collection bd --max-minutes 25 || true
            python scripts/enrich.py $ARGS --collection romans --max-minutes 30 || true
          else
            python scripts/enrich.py $ARGS --collection "$COLLECTION"
          fi

      - name: Enregistrer les résultats
        if: ${{ !cancelled() && !inputs.serie }}
        run: |
          git config user.name "suivixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FICHIERS="data/enrich.json data/bd/enrich.json data/romans/enrich.json"
          if [ -z "$(git status --porcelain data couvertures 2>/dev/null | grep -E 'enrich.json|couvertures')" ]; then echo "Rien de nouveau."; exit 0; fi
          mkdir -p /tmp/fusion /tmp/couv
          for f in $FICHIERS; do
            k=$(echo "$f" | tr '/' '_')
            git show "HEAD:$f" > "/tmp/fusion/base_$k" 2>/dev/null || echo '{"series":{}}' > "/tmp/fusion/base_$k"
            [ -f "$f" ] && cp "$f" "/tmp/fusion/nous_$k"
          done
          cp -r couvertures/. /tmp/couv/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # fusion avec ce qu'une autre vérification ou une publication a pu enregistrer entre-temps
            for f in $FICHIERS; do
              k=$(echo "$f" | tr '/' '_')
              [ -f "/tmp/fusion/nous_$k" ] || continue
              mkdir -p "$(dirname "$f")"
              [ -f "$f" ] || echo '{"series":{}}' > "$f"
              python scripts/fusion_enrich.py "/tmp/fusion/base_$k" "/tmp/fusion/nous_$k" "$f" > /tmp/fusion/res.json
              cp /tmp/fusion/res.json "$f"
              git add "$f"
            done
            mkdir -p couvertures && cp -r /tmp/couv/. couvertures/ 2>/dev/null || true
            git add couvertures 2>/dev/null || true
            git diff --cached --quiet && { echo "Rien de nouveau."; exit 0; }
            git commit -q -m "Vérification des parutions"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
