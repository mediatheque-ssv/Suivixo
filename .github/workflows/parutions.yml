name: Vérifier les parutions

on:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch:
    inputs:
      serie:
        description: "Tester une seule série (identifiant, ex. atelier-des-sorciers). Rien n'est enregistré."
        required: false
        default: ""
      limite:
        description: "Nombre maximum de séries à vérifier (vide = toutes)"
        required: false
        default: ""
      forcer:
        description: "Tout revérifier, même les séries vues récemment"
        type: boolean
        default: false
      bnf_seulement:
        description: "Refaire seulement la BnF (plus rapide, garde AniList)"
        type: boolean
        default: false
      verifier_auteurs:
        description: "Revérifier les liens AniList automatiques avec l'auteur d'Orphée"
        type: boolean
        default: false
      manga_news_seulement:
        description: "Mettre à jour seulement le nombre de tomes Manga-News (rapide)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # les tests d'une seule série tournent à part, sans bloquer ni annuler les passages complets
  group: parutions-${{ inputs.serie && 'test' || 'complet' }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Pillow (vignettes des couvertures)
        run: pip install --quiet pillow

      - name: Interroger AniList et la BnF
        env:
          SERIE: ${{ inputs.serie }}
          LIMITE: ${{ inputs.limite }}
          FORCER: ${{ inputs.forcer }}
          BNF: ${{ inputs.bnf_seulement }}
          AUTEURS: ${{ inputs.verifier_auteurs }}
          MN: ${{ inputs.manga_news_seulement }}
        run: |
          ARGS="--max-minutes 120"
          [ -n "$SERIE" ] && ARGS="$ARGS --serie $SERIE"
          [ -n "$LIMITE" ] && ARGS="$ARGS --limite $LIMITE"
          [ "$FORCER" = "true" ] && ARGS="$ARGS --forcer"
          [ "$BNF" = "true" ] && ARGS="$ARGS --bnf-seulement"
          [ "$AUTEURS" = "true" ] && ARGS="$ARGS --verifier-auteurs"
          [ "$MN" = "true" ] && ARGS="$ARGS --manga-news-seulement"
          python scripts/enrich.py $ARGS

      - name: Enregistrer les résultats
        if: ${{ !cancelled() && !inputs.serie }}
        run: |
          git config user.name "suivixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/enrich.json && [ -z "$(git status --porcelain couvertures 2>/dev/null)" ]; then echo "Rien de nouveau."; exit 0; fi
          git show HEAD:data/enrich.json > /tmp/base.json
          cp data/enrich.json /tmp/nous.json
          mkdir -p /tmp/couv && cp -r couvertures/. /tmp/couv/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # fusion avec ce qu'une autre vérification a pu enregistrer entre-temps
            python scripts/fusion_enrich.py /tmp/base.json /tmp/nous.json data/enrich.json > /tmp/fusion.json
            cp /tmp/fusion.json data/enrich.json
            mkdir -p couvertures && cp -r /tmp/couv/. couvertures/ 2>/dev/null || true
            git add data/enrich.json couvertures 2>/dev/null || git add data/enrich.json
            git diff --cached --quiet && { echo "Rien de nouveau."; exit 0; }
            git commit -q -m "Vérification des parutions (AniList, BnF, Manga-News)"
            git push -q origin HEAD:main && exit 0
            sleep 7
          done
          exit 1
